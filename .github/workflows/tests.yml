name: Tests and public content policy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    steps:
      - name: Install ngspice
        run: |
          apt-get update
          apt-get install -y git ngspice libgl1 libegl1 libglib2.0-0 libfontconfig1 libxkbcommon0 libdbus-1-3
        env:
          DEBIAN_FRONTEND: noninteractive
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python dependencies in a virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[gui,test]'
      - name: Run tests
        run: .venv/bin/python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check public content
        run: .venv/bin/python tools/check_public_content.py
